reviews:
  request_changes: false
  auto_review:
    enabled: true
    drafts: false
  auto_approve_small_prs: false
  review_status: true
  auto_label: true
  max_files_to_review: 120

rules:
  - type: pattern
    pattern: |
      ^(build|\.dart_tool|pubspec\.lock|\.flutter-plugins-dependencies|\.metadata|\.DS_Store)
    exclude: true
  - type: pattern
    pattern: |
      ^(android|ios|macos|web)/
    exclude: true
  - type: pattern
    pattern: |
      ^assets/
    exclude: true
  - type: pattern
    pattern: |
      ^test/|_test\.dart$
    exclude: true
  - type: pattern
    pattern: |
      ^(docs|\.github/workflows)|\.md$|\.env\.example|\.fvmrc|devtools_options\.yaml|analysis_options\.yaml
    exclude: true
  - type: pattern
    pattern: |
      (\.freezed\.dart|\.g\.dart|\.config\.dart|\.part\.dart|generated_|l10n/)
    exclude: true
  - type: pattern
    pattern: |
      ^lib/features/(community/presentation/view|ecommerce/presentation/widgets/buy_pet|store_profile|my_pets/presentation/widgets)/
    exclude: true
